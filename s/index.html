<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomology - Discover Recipes Matched to Your Taste</title>

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self' https://nomology-be.onrender.com;
                   img-src 'self' https://nomology.food data:;">

    <!-- Preconnect to API for faster requests -->
    <link rel="preconnect" href="https://nomology-be.onrender.com">

    <!-- OG Meta Tags for Social Sharing Previews -->
    <meta property="og:title" content="Your friend shared something on Nomology" />
    <meta property="og:description" content="Discover recipes matched to your taste" />
    <meta property="og:image" content="https://nomology.food/images/hero_image.png" />
    <meta property="og:url" content="https://nomology.food/s/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nomology" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your friend shared something on Nomology" />
    <meta name="twitter:description" content="Discover recipes matched to your taste" />
    <meta name="twitter:image" content="https://nomology.food/images/hero_image.png" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #F5F1F1 0%, #E8E4E4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #33281C;
        }

        .container {
            max-width: 400px;
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #33281C;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #E8E4E4;
            border-top-color: #BD4527;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            will-change: transform;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: #666;
        }

        .btn {
            display: none;
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #BD4527;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(189, 69, 39, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn + .btn {
            margin-top: 12px;
        }

        .error {
            display: none;
            color: #BD4527;
            margin-top: 16px;
            font-size: 14px;
        }

        .copy-feedback {
            display: none;
            color: #4CAF50;
            font-size: 12px;
            margin-top: 8px;
        }

        .privacy-notice {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }

        .privacy-notice a {
            color: #BD4527;
            text-decoration: none;
        }

        .privacy-notice a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Nomology logo -->
        <svg class="logo" viewBox="0 0 41 41" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 7.59259C0 3.39932 3.39932 0 7.59259 0H33.4074C37.6007 0 41 3.39932 41 7.59259V33.4074C41 37.6007 37.6007 41 33.4074 41H7.59259C3.39932 41 0 37.6007 0 33.4074V7.59259Z" fill="#BD4527"/>
            <path d="M14.9107 9.02637C14.9149 9.02658 14.9193 9.02802 14.9234 9.02832C15.6685 9.06148 16.3616 9.42834 16.8072 10.0312L27.9967 25.1729V16.1084C27.6751 16.031 27.3942 15.8839 27.1402 15.6592C26.779 15.3395 26.4957 14.8827 26.2037 14.377C26.0751 14.1542 25.5196 13.2621 24.9195 12.293C24.3268 11.3357 23.6936 10.3093 23.4254 9.84473C23.328 9.67582 23.328 9.46773 23.4254 9.29883C23.523 9.12977 23.7038 9.02539 23.899 9.02539H33.1881C33.3852 9.02549 33.5669 9.13192 33.6637 9.30371C33.7604 9.47551 33.757 9.68582 33.6549 9.85449L30.9254 14.3584C30.7033 14.7429 30.4328 15.189 30.0758 15.5361C29.8093 15.7952 29.4842 16.0068 29.0894 16.1084V31.9746L28.2242 31.9736L28.2232 31.9746C27.9485 31.9746 27.6903 31.844 27.5269 31.623L13.4264 12.5391V20.7471C13.4266 22.7639 15.4293 24.6765 15.4293 26.6934V26.9658L15.1559 31.4736C15.1558 31.7751 15.0482 31.9501 14.7467 31.9502C14.445 31.9502 14.3366 31.7752 14.3365 31.4736V27.7969C14.3363 27.5388 14.1268 27.3301 13.8687 27.3301C13.6163 27.3302 13.4097 27.5308 13.4019 27.7832L13.2896 31.4287C13.2895 31.7302 13.1811 31.9746 12.8795 31.9746C12.578 31.9745 12.4695 31.7302 12.4693 31.4287L12.358 27.7832C12.3502 27.5305 12.1431 27.3301 11.8902 27.3301C11.6319 27.3302 11.4225 27.5395 11.4225 27.7979V31.4287C11.4223 31.7302 11.3139 31.9746 11.0123 31.9746C10.711 31.9744 10.6033 31.8032 10.6031 31.502L10.3297 26.9658V26.6934C10.3297 24.6765 12.3333 22.7639 12.3336 20.7471V11.1201C12.3336 10.5669 11.8848 10.1183 11.3316 10.1182H10.148C9.84642 10.1182 9.60142 9.87383 9.60117 9.57227C9.60117 9.27992 9.83101 9.04099 10.1197 9.02637L10.8766 9.02539H14.8834L14.9107 9.02637ZM26.1559 12.2129C26.6263 12.9721 27.0348 13.6315 27.15 13.8311C27.4498 14.3502 27.6548 14.655 27.8648 14.8408C28.0403 14.9961 28.2342 15.0811 28.5768 15.0811C28.8628 15.081 29.0911 14.9688 29.3141 14.752C29.5522 14.5203 29.7589 14.1947 29.983 13.8066L29.9889 13.7969L30.9488 12.2129H26.1559ZM25.481 11.1201H31.61L32.2174 10.1182C30.4411 10.1182 26.7281 10.1182 24.8639 10.1182C25.0482 10.4203 25.2613 10.7642 25.481 11.1201Z" fill="#F5F1F1"/>
        </svg>

        <h1 id="title">Opening Nomology...</h1>
        <p class="subtitle" id="subtitle">Discover recipes matched to your taste</p>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span class="loading-text">Redirecting to app...</span>
        </div>

        <!-- iOS App Store Button -->
        <a href="#" class="btn" id="app-store-btn">
            Get on App Store
        </a>
        <span class="copy-feedback" id="copy-feedback">Link copied to clipboard!</span>

        <!-- Android Play Store Button -->
        <a href="#" class="btn" id="play-store-btn">
            Get on Google Play
        </a>

        <!-- Open in app (for in-app browsers that suppress Universal Links) -->
        <a href="#" class="btn" id="open-app-btn">
            Open in Nomology
        </a>

        <p class="error" id="error"></p>

        <p class="privacy-notice" id="privacy-notice">
            We collect device signals to connect you to <span id="creator-name">your friend</span>'s invitation. This data is deleted within 24 hours. <a href="/privacy.html">Privacy Policy</a>
        </p>
    </div>

    <script>
        // ===========================================
        // Configuration Constants
        // ===========================================
        const CONFIG = {
            API_BASE: 'https://nomology-be.onrender.com',
            APP_STORE_URL: 'https://apps.apple.com/app/id6736435209',
            PLAY_STORE_BASE: 'https://play.google.com/store/apps/details',
            PACKAGE_NAME: 'food.nomology',
            HOST: 'nomology.food',

            // Share code must be exactly 10 alphanumeric characters
            SHARE_CODE_PATTERN: /^[a-zA-Z0-9]{10}$/,

            // Timing constants
            APP_OPEN_DETECT_DELAY_MS: 1500,  // Time to wait before assuming app didn't open
            FALLBACK_SHOW_DELAY_MS: 2000,    // Time to wait before showing fallback UI
            FETCH_TIMEOUT_MS: 5000           // API request timeout
        };

        // ===========================================
        // DOM Element Cache
        // ===========================================
        const DOM = {};

        function cacheDOMElements() {
            DOM.loading = document.getElementById('loading');
            DOM.error = document.getElementById('error');
            DOM.title = document.getElementById('title');
            DOM.subtitle = document.getElementById('subtitle');
            DOM.appStoreBtn = document.getElementById('app-store-btn');
            DOM.playStoreBtn = document.getElementById('play-store-btn');
            DOM.openAppBtn = document.getElementById('open-app-btn');
            DOM.copyFeedback = document.getElementById('copy-feedback');
            DOM.creatorName = document.getElementById('creator-name');
        }

        // ===========================================
        // Share Code Parsing and Validation
        // ===========================================
        function parseShareCode() {
            const pathParts = window.location.pathname.split('/');
            const rawCode = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
            return rawCode || '';
        }

        function isValidShareCode(code) {
            return code && CONFIG.SHARE_CODE_PATTERN.test(code);
        }

        // Parse and validate share code immediately
        const rawShareCode = parseShareCode();
        const shareCode = isValidShareCode(rawShareCode) ? rawShareCode : null;
        const fullUrl = window.location.href;

        // ===========================================
        // Platform Detection
        // ===========================================
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isInAppBrowser = /FBAN|FBAV|Instagram|BytedanceWebview|musical_ly|Twitter|LinkedInApp|Snapchat|Pinterest|Reddit|Barcelona/i.test(navigator.userAgent);

        // ===========================================
        // Fingerprint Collection
        // ===========================================
        function parseDeviceModel(ua) {
            if (/iPhone/.test(ua)) return 'iPhone';
            if (/iPad/.test(ua)) return 'iPad';
            if (/Android/.test(ua)) {
                const match = ua.match(/Android[^;]*;\s*([^)]+)/);
                return match ? match[1].trim() : 'Android';
            }
            return 'Desktop';
        }

        function parseBrowserFamily(ua) {
            if (/Safari/.test(ua) && !/Chrome/.test(ua)) return 'Safari';
            if (/Chrome/.test(ua)) return 'Chrome';
            if (/Firefox/.test(ua)) return 'Firefox';
            return 'Other';
        }

        function getTimezone() {
            try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone;
            } catch (e) {
                return undefined;
            }
        }

        function collectSignals() {
            return {
                share_code: shareCode,
                device_model: parseDeviceModel(navigator.userAgent),
                screen_resolution: `${screen.width}x${screen.height}`,
                pixel_ratio: window.devicePixelRatio,
                timezone: getTimezone(),
                language: navigator.language,
                browser_family: parseBrowserFamily(navigator.userAgent)
            };
        }

        // Record fingerprint (fire-and-forget, no blocking)
        function recordFingerprint() {
            if (!shareCode) return;

            const signals = collectSignals();
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), CONFIG.FETCH_TIMEOUT_MS);

            fetch(`${CONFIG.API_BASE}/api/v3/social/fingerprint`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(signals),
                signal: controller.signal
            })
            .catch(() => {})  // Best-effort, don't block
            .finally(() => clearTimeout(timeoutId));
        }

        // ===========================================
        // Clipboard Handling
        // ===========================================
        async function copyToClipboard(text) {
            if (navigator.clipboard) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {
                    // Fall through to fallback
                }
            }

            // Fallback for older browsers
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                return true;
            } catch (e) {
                return false;
            }
        }

        function showCopyFeedback(success) {
            if (DOM.copyFeedback) {
                DOM.copyFeedback.textContent = success
                    ? 'Link copied to clipboard!'
                    : 'Could not copy link';
                DOM.copyFeedback.style.color = success ? '#4CAF50' : '#BD4527';
                DOM.copyFeedback.style.display = 'block';
            }
        }

        // ===========================================
        // UI Updates
        // ===========================================
        function showError(message) {
            DOM.loading.style.display = 'none';
            DOM.error.textContent = message;
            DOM.error.style.display = 'block';
        }

        function updateTitleForShareType(data) {
            // Sanitize display name - remove any HTML/script tags
            const creatorName = sanitizeDisplayName(data.creator_display_name);

            // Update privacy notice with creator name
            if (DOM.creatorName) {
                DOM.creatorName.textContent = creatorName;
            }

            if (data.type === 'taste_buds') {
                DOM.title.textContent = `${creatorName} wants to find your Taste Match!`;
                DOM.subtitle.textContent = 'See which recipe you\'ll both love';
            } else if (data.type === 'recipe') {
                DOM.title.textContent = `${creatorName} shared a recipe with you!`;
                DOM.subtitle.textContent = 'Open in Nomology to see the recipe';
            } else if (data.type === 'profile') {
                DOM.title.textContent = `Check out ${creatorName}'s flavor profile!`;
                DOM.subtitle.textContent = 'Discover your own taste profile';
            }
        }

        function sanitizeDisplayName(name) {
            if (!name || typeof name !== 'string') return 'A friend';
            // Strip all angle brackets to prevent any HTML injection
            const cleaned = name.replace(/[<>]/g, '').trim();
            if (cleaned.length === 0) return 'A friend';
            if (cleaned.length > 50) return cleaned.substring(0, 47) + '...';
            return cleaned;
        }

        // ===========================================
        // iOS App Store Handler
        // ===========================================
        function openAppStore(e) {
            e.preventDefault();

            // Record fingerprint before redirecting
            recordFingerprint();

            // Copy URL to clipboard and show feedback
            copyToClipboard(fullUrl).then((success) => {
                showCopyFeedback(success);
                // Redirect to App Store after brief delay to show feedback
                setTimeout(() => {
                    // Use itms-apps:// scheme for iOS to open App Store app directly
                    if (isIOS) {
                        window.location.href = `itms-apps://itunes.apple.com/app/id6736435209`;
                    } else {
                        window.location.href = CONFIG.APP_STORE_URL;
                    }
                }, 300);
            });
        }

        // ===========================================
        // API Validation
        // ===========================================
        async function validateShareLink() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), CONFIG.FETCH_TIMEOUT_MS);

            try {
                const response = await fetch(
                    `${CONFIG.API_BASE}/api/v3/social/share-link/${shareCode}`,
                    { signal: controller.signal }
                );
                clearTimeout(timeoutId);

                if (!response.ok) {
                    // Use generic message to avoid information leakage
                    if (response.status === 404 || response.status === 410) {
                        showError('This share link is invalid or has expired');
                    } else {
                        showError('Could not validate share link');
                    }
                    return null;
                }

                const data = await response.json();

                // Validate response shape
                if (!data || typeof data.type !== 'string') {
                    showError('Invalid share link data');
                    return null;
                }

                return data;
            } catch (e) {
                clearTimeout(timeoutId);
                // Continue anyway on network errors - let the app handle validation
                return {};
            }
        }

        // ===========================================
        // Platform-Specific Redirect Handlers
        // ===========================================
        function handleAndroidRedirect() {
            // Record fingerprint before redirect attempt
            recordFingerprint();

            const encodedShareCode = encodeURIComponent(shareCode);

            if (isInAppBrowser) {
                // In-app browsers (Facebook, Instagram, etc.) block intent URLs.
                // Show "Open in Nomology" button with custom scheme + Play Store fallback.
                DOM.loading.style.display = 'none';
                DOM.openAppBtn.href = `food.nomology://s/${encodedShareCode}`;
                DOM.openAppBtn.style.display = 'block';
                DOM.playStoreBtn.style.display = 'block';
                DOM.playStoreBtn.href =
                    `${CONFIG.PLAY_STORE_BASE}?id=${CONFIG.PACKAGE_NAME}&referrer=${encodeURIComponent(fullUrl)}`;
                return;
            }

            // Build intent URL with validated share code
            const playIntent = `intent://s/${encodedShareCode}#Intent;` +
                `scheme=https;` +
                `host=${CONFIG.HOST};` +
                `package=${CONFIG.PACKAGE_NAME};` +
                `S.browser_fallback_url=${CONFIG.PLAY_STORE_BASE}` +
                `?id=${CONFIG.PACKAGE_NAME}&referrer=${encodeURIComponent(fullUrl)};end`;

            // Try to open app first
            window.location.href = playIntent;

            // Show fallback after delay
            setTimeout(() => {
                DOM.loading.style.display = 'none';
                DOM.playStoreBtn.style.display = 'block';
                DOM.playStoreBtn.href =
                    `${CONFIG.PLAY_STORE_BASE}?id=${CONFIG.PACKAGE_NAME}&referrer=${encodeURIComponent(fullUrl)}`;
            }, CONFIG.FALLBACK_SHOW_DELAY_MS);
        }

        function handleiOSRedirect() {
            const encodedShareCode = encodeURIComponent(shareCode);

            // Record fingerprint in case clipboard fails
            recordFingerprint();

            if (isInAppBrowser) {
                // In-app browsers (Facebook, Instagram, etc.) suppress Universal Links.
                // Show "Open in Nomology" button with custom scheme to bypass the WebView,
                // plus App Store button as fallback if app isn't installed.
                DOM.loading.style.display = 'none';
                DOM.openAppBtn.href = `food.nomology://s/${encodedShareCode}`;
                DOM.openAppBtn.style.display = 'block';
                DOM.appStoreBtn.style.display = 'block';
                return;
            }

            // On iOS, Universal Links only work when iOS intercepts the link
            // BEFORE it reaches the browser. Since we're already on this page,
            // we can't trigger the Universal Link - just show the App Store button.
            DOM.loading.style.display = 'none';
            DOM.appStoreBtn.style.display = 'block';
        }

        function handleDesktopDisplay() {
            DOM.loading.style.display = 'none';
            DOM.title.textContent = 'Get Nomology on your phone';
            DOM.subtitle.textContent = 'Scan this QR code or visit on your mobile device';

            // Show both buttons on desktop
            DOM.appStoreBtn.style.display = 'block';
            DOM.appStoreBtn.onclick = function(e) {
                e.preventDefault();
                window.open(CONFIG.APP_STORE_URL, '_blank');
            };

            DOM.playStoreBtn.style.display = 'block';
            DOM.playStoreBtn.style.marginTop = '12px';
            DOM.playStoreBtn.href =
                `${CONFIG.PLAY_STORE_BASE}?id=${CONFIG.PACKAGE_NAME}&referrer=${encodeURIComponent(fullUrl)}`;
        }

        // ===========================================
        // Main Initialization
        // ===========================================
        async function init() {
            // Cache DOM elements
            cacheDOMElements();

            // Set up event handlers
            DOM.appStoreBtn.onclick = openAppStore;

            // Validate share code format first (security gate)
            if (!shareCode) {
                showError('Invalid share link');
                return;
            }

            // Validate share code exists on server
            const shareData = await validateShareLink();
            if (shareData === null) {
                // Error already shown by validateShareLink
                return;
            }

            // Update UI with share type info
            if (shareData.type) {
                updateTitleForShareType(shareData);
            }

            // Platform-specific handling
            if (isAndroid) {
                handleAndroidRedirect();
            } else if (isIOS) {
                handleiOSRedirect();
            } else {
                handleDesktopDisplay();
            }
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
